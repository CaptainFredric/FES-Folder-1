name: Add DanDeBugger if missing

on:
  workflow_dispatch:
  schedule:
    - cron: '0 2 * * 0' # weekly

jobs:
  add-file:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check for docs/DanDeBugger.md
        id: check
        run: |
          if [ -f docs/DanDeBugger.md ]; then
            echo "present=true" >> $GITHUB_OUTPUT
            exit 0
          else
            echo "present=false" >> $GITHUB_OUTPUT
          fi

      - name: Add DanDeBugger file to workspace
        if: steps.check.outputs.present == 'false'
        run: |
          echo "docs/DanDeBugger.md missing — adding from .github/dan/DanDeBugger.md"
          mkdir -p docs
          cp .github/dan/DanDeBugger.md docs/DanDeBugger.md

      - name: Create PR for added DanDeBugger
        if: steps.check.outputs.present == 'false'
        uses: peter-evans/create-pull-request@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          branch: add-dan-de-bugger
          title: "chore: add DanDeBugger instructions"
          body: |
            Adds the DanDeBugger persona instructions to `docs/DanDeBugger.md`.
            This file was missing and is now proposed via this automated PR.
          commit-message: "chore: add DanDeBugger instructions"
